name: build-immortalwrt-r5s

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 5'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: master

  FEEDS_CONF: config/immortalwrt.feeds.conf.default
  CONFIG_FILE: config/r5s/immortalwrt.config

  DIY_P1_SH: config/diy-part1.sh
  DIY_P2_SH: config/diy-part2.sh

  WORK_DIR: immortalwrt
  PLATFORM: rockchip
  TZ: Asia/Shanghai

  # ccache configuration - balanced for speed and stability
  CCACHE_SIZE: 10G
  CCACHE_MAXFILES: 0
  CCACHE_SLOPPINESS: file_macro,time_macros,include_file_ctime
  CCACHE_BASEDIR: ${{ github.workspace }}/immortalwrt
  CCACHE_DIR: ${{ github.workspace }}/immortalwrt/.ccache

  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 \
            ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext \
            git gnutls-dev gperf haveged help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev \
            lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd \
            zlib1g-dev zstd
          sudo timedatectl set-timezone "${TZ}"

      - name: Show environment
        run: |
          uname -a
          df -hT

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --single-branch --branch "${REPO_BRANCH}" "${REPO_URL}" "${WORK_DIR}"
          test -f "${WORK_DIR}/scripts/feeds"

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/dl
            ${{ env.WORK_DIR }}/.ccache
            ${{ env.WORK_DIR }}/build_dir
            ${{ env.WORK_DIR }}/staging_dir
          key: ${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ hashFiles('config/**', '.github/workflows/build-immortalwrt-r5s.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.REPO_BRANCH }}-
            ${{ runner.os }}-

      - name: Load custom feeds
        run: |
          cp -f "${FEEDS_CONF}" "${WORK_DIR}/feeds.conf.default"
          chmod +x "${DIY_P1_SH}"
          cd "${WORK_DIR}"
          "${GITHUB_WORKSPACE}/${DIY_P1_SH}"

      - name: Update feeds
        run: |
          cd "${WORK_DIR}"
          ./scripts/feeds update -a -f
          ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cp -f "${CONFIG_FILE}" "${WORK_DIR}/.config"
          chmod +x "${DIY_P2_SH}"
          cd "${WORK_DIR}"
          "${GITHUB_WORKSPACE}/${DIY_P2_SH}"

      - name: Configure ccache
        run: |
          mkdir -p "${WORK_DIR}/.ccache"
          ccache -M "${CCACHE_SIZE}"
          ccache -z
          ccache -s

      - name: Record build start
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download packages
        run: |
          cd "${WORK_DIR}"
          make defconfig
          make download -j8 || true
          make download -j8 || true
          make download -j8

      - name: Show disk before build
        run: df -hT

      - name: Build firmware
        id: build
        run: |
          cd "${WORK_DIR}"
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="${GITHUB_WORKSPACE}/${WORK_DIR}/.ccache"
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}/${WORK_DIR}"
          
          # Use conservative parallel jobs for stability (4 cores)
          # This is safe and proven to work with ImmortalWrt
          make -j4
          
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Build statistics
        if: steps.build.outputs.status == 'success'
        run: |
          END=$(date +%s)
          COST=$((END-BUILD_START))
          echo "Build Time: $((COST/60)) Minutes"
          ccache -s

      - name: Organize files
        id: organize
        if: steps.build.outputs.status == 'success'
        run: |
          cd "${WORK_DIR}/bin/targets"/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: ImmortalWrt-R5S-${{ github.run_number }}
          path: ${{ env.FIRMWARE }}
          retention-days: 5

      - name: Generate release tag
        id: tag
        if: steps.organize.outputs.status == 'success'
        run: |
          echo "RELEASE_TAG=R5S-$(date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=R5S-$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Upload release
        uses: ncipollo/release-action@v1
        if: steps.organize.outputs.status == 'success'
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: ${{ env.FIRMWARE }}/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ImmortalWrt Auto Build

            Device: NanoPi R5S
            Branch: master
            Build Time: ${{ github.run_number }}

      - name: Delete old workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 10
          keep_minimum_runs: 10
          token: ${{ secrets.GH_TOKEN }}

      - name: Delete releases older than 30 days
        if: always()
        run: |
          # Ensure jq is available for JSON parsing
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends jq

          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          DAYS=30
          cutoff=$(date -d "-${DAYS} days" +%s)

          echo "Deleting releases older than ${DAYS} days (but keep the latest 5 releases) (before $(date -d "-${DAYS} days" +"%Y-%m-%d"))"

          # Temp files
          release_list_file="/tmp/releases_list.txt"
          keep_tags_file="/tmp/keep_release_tags.txt"
          : > "$release_list_file"
          : > "$keep_tags_file"

          # 1) Paginate through releases and gather them (API returns newest first)
          page=1
          while :; do
            resp=$(curl -s -H "Authorization: token ${TOKEN}" "https://api.github.com/repos/${REPO}/releases?per_page=100&page=${page}")
            count=$(echo "$resp" | jq length)
            if [ "$count" -eq 0 ]; then
              break
            fi

            # save lines: id<TAB>tag_name<TAB>published_at
            echo "$resp" | jq -r '.[] | "\(.id)\t\(.tag_name)\t\(.published_at)"' >> "$release_list_file"

            page=$((page+1))
          done

          total=$(wc -l < "$release_list_file" | tr -d ' ')
          echo "Total releases found: $total"

          if [ "$total" -le 5 ]; then
            echo "There are $total releases, which is <= 5. Nothing to delete."
          else
            # Record tags to keep (first 5 releases)
            head -n 5 "$release_list_file" | awk -F'\t' '{ if ($2 != "" && $2 != "null") print $2 }' > "$keep_tags_file"
            echo "Keeping tags from latest 5 releases:"
            cat "$keep_tags_file" || true

            # Delete releases after the first 5
            tail -n +6 "$release_list_file" | while IFS=$'\t' read -r id tag published_at; do
              if [ -z "$id" ] || [ "$id" = "null" ]; then
                continue
              fi
              echo "Deleting release $id (tag=$tag published=$published_at)"
              curl -s -X DELETE -H "Authorization: token ${TOKEN}" "https://api.github.com/repos/${REPO}/releases/$id" || true

              # Also attempt to delete the tag ref for this release (if present)
              if [ -n "$tag" ] && [ "$tag" != "null" ]; then
                echo "Deleting tag refs/tags/$tag (release deletion step)"
                curl -s -X DELETE -H "Authorization: token ${TOKEN}" "https://api.github.com/repos/${REPO}/git/refs/tags/$tag" || true
              fi
            done
          fi

          # 2) Now scan all tags and delete orphan/old tags that are NOT referenced by kept releases
          echo "Scanning all tags and deleting orphan tags older than ${DAYS} days..."
          tag_page=1
          while :; do
            tags_resp=$(curl -s -H "Authorization: token ${TOKEN}" "https://api.github.com/repos/${REPO}/tags?per_page=100&page=${tag_page}")
            tags_count=$(echo "$tags_resp" | jq length)
            if [ "$tags_count" -eq 0 ]; then
              break
            fi

            echo "$tags_resp" | jq -r '.[] | "\(.name)\t\(.commit.sha)"' | while IFS=$'\t' read -r tag sha; do
              # skip tags used by kept releases
              if [ -f "$keep_tags_file" ] && grep -Fxq "$tag" "$keep_tags_file"; then
                echo "Skipping tag $tag because it belongs to one of the latest 5 releases"
                continue
              fi

              # get commit date for the tag's commit
              commit_date=$(curl -s -H "Authorization: token ${TOKEN}" "https://api.github.com/repos/${REPO}/commits/${sha}" | jq -r '.commit.author.date')
              if [ -z "$commit_date" ] || [ "$commit_date" = "null" ]; then
                continue
              fi
              commit_ts=$(date -d "$commit_date" +%s)
              if [ "$commit_ts" -lt "$cutoff" ]; then
                echo "Deleting orphan tag $tag (commit date $commit_date)"
                curl -s -X DELETE -H "Authorization: token ${TOKEN}" "https://api.github.com/repos/${REPO}/git/refs/tags/$tag" || true
              fi
            done

            tag_page=$((tag_page+1))
          done

          # cleanup
          rm -f "$release_list_file" "$keep_tags_file"

      - name: Cleanup
        if: always()
        run: |
          cd "${WORK_DIR}"
          rm -rf tmp
          df -hT
